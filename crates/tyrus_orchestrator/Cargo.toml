[package]
name = "tyrus_orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tyrus_parser = { path = "../tyrus_parser" }
tyrus_analyzer = { path = "../tyrus_analyzer" }
tyrus_codegen = { path = "../tyrus_codegen" }
tyrus_common = { path = "../tyrus_common" }
tyrus_diagnostics = { path = "../tyrus_diagnostics" }
# tyrus_di is needed transitively for types if we expose them, 
# but for now we just use the result.
tyrus_di = { path = "../tyrus_di" }

swc_ecma_ast = "28.0.0"
miette = { version = "7.6.0", features = ["fancy"] } # Matched miette version too
walkdir = "2.3"
tokio = { version = "1.52", features = ["full"] }
prettyplease = "0.3"
syn = { version = "3.0", features = ["full", "parsing"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "transpiler"
harness = false

[[bench]]
name = "runtime_comparison"
harness = false

[lints]
workspace = true
