[workspace]
members = ["crates/*", "tests"]
resolver = "2"

# Shared package metadata. Each crate's Cargo.toml inherits these via
# `field.workspace = true` so the license and edition stay in sync across
# all 11 workspace crates (cargo-deny enforces that an SPDX license is set).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Gefferson Souza"]
repository = "https://github.com/Gefferson-Souza/Tyrus"
description = "Tyrus — TypeScript-to-Rust transpiler targeting NestJS → Axum."

[profile.release]
lto = true
