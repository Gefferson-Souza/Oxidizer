name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Fast checks — run in parallel, fail fast
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  # Supply-chain & security checks — run in parallel with build, share cache.
  # `cargo deny` enforces deny.toml (advisories, licenses, banned crates,
  # source registries). `cargo audit` cross-checks against the RustSec
  # advisory DB on every push/PR rather than relying on a periodic run.
  security:
    name: Security & Supply-Chain
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        # Ignored advisories are tracked in deny.toml `[advisories].ignore`
        # AND duplicated here because cargo-audit ignores deny.toml. See
        # follow-up issue for upgrade plan.
        run: cargo audit --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2026-0097 --deny warnings

  # Build + test in single job (shares compilation cache within job)
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 22 (for semantic equivalence tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo nextest run --workspace

      - name: Verify Real-World Demo
        run: |
          ./target/debug/tyrus build examples/real_world_demo/src --output examples/real_world_demo/output
          cd examples/real_world_demo/output && cargo check

  # Benchmarks — run after tests pass, upload criterion HTML reports
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 22 (for runtime comparison)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run transpilation benchmarks
        run: cargo bench --bench transpiler

      - name: Run runtime comparison
        run: BENCH_ITERATIONS=3 cargo bench --bench runtime_comparison
        env:
          BENCH_CSV: 1

      - name: Upload criterion reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: target/criterion/
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
