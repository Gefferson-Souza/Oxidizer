# Automated dependency updates for the workspace.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Cargo workspace — all 11 crates share the workspace root.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group SWC crates together (they version-lock as a family).
      swc:
        patterns:
          - "swc_*"
      # Group all dev-dependency-only updates into one PR.
      dev-dependencies:
        dependency-type: "development"

  # GitHub Actions used by .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # npm — keeps the reference NestJS fixture up to date for E2E tests.
  - package-ecosystem: "npm"
    directory: "/tests/fixtures/reference_nestjs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "tests"
    commit-message:
      prefix: "chore(test-deps)"
