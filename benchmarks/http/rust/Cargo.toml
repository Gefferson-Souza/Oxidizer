[package]
name = "tyrus_app"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive", "rc"] }

[[bin]]
name = "server"
path = "src/main.rs"

[lib]
name = "tyrus_app"
path = "src/lib.rs"
